  <main>
    <section class="login-section">
      <div class="hero-gradient-mesh"></div>

      <div class="login-container">
        <div class="login-card">
          <div style="text-align: center; margin-bottom: 32px;">
            <img src="assets/transparentlogo.png" alt="Ventry AI" width="48" height="48" style="margin-bottom: 16px;" />
            <h1 style="font-size: 28px; font-weight: 700;">Welcome back</h1>
            <p style="color: var(--text-muted); margin-top: 8px;">Log in to manage your AI receptionist</p>
          </div>

          <form id="login-form" autocomplete="on">
            <div class="form-field">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="Enter your email" />
            </div>
            <div class="form-field">
              <label for="login-password">Password</label>
              <div class="password-field">
                <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
                <button type="button" class="password-toggle" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
              <a href="#" id="forgot-password" style="font-size: 14px; color: var(--purple-light);">Forgot password?</a>
            </div>

            <div class="login-error" id="login-error" style="display: none;"></div>
            <div class="login-success" id="login-success" style="display: none;"></div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="login-btn">Log in</button>
          </form>

          <p style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px;">
            Don't have an account? <a href="signup.html" style="color: var(--purple-light); font-weight: 500;">Sign up free</a>
          </p>
        </div>
      </div>
    </section>

  <script src="auth.js"></script>
  <script>
    (function () {
      'use strict';

      var loginForm = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');
      var successEl = document.getElementById('login-success');

      // Password toggle
      document.querySelectorAll('.password-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = btn.previousElementSibling;
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      // Forgot password
      var forgotLink = document.getElementById('forgot-password');
      if (forgotLink) {
        forgotLink.addEventListener('click', async function (e) {
          e.preventDefault();
          var email = document.getElementById('login-email').value.trim();
          if (!email) {
            errorEl.textContent = 'Enter your email first, then click forgot password.';
            errorEl.style.display = 'block';
            return;
          }
          if (window.__ventryAuth && window.__ventryAuth.client) {
            var result = await window.__ventryAuth.client.auth.resetPasswordForEmail(email);
            if (result.error) {
              errorEl.textContent = result.error.message;
              errorEl.style.display = 'block';
            } else {
              errorEl.style.display = 'none';
              successEl.textContent = 'Password reset email sent. Check your inbox.';
              successEl.style.display = 'block';
            }
          }
        });
      }

      // Login form
      if (loginForm) {
        loginForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          errorEl.style.display = 'none';
          successEl.style.display = 'none';

          var email = document.getElementById('login-email').value.trim();
          var password = document.getElementById('login-password').value;
          var btn = document.getElementById('login-btn');

          btn.disabled = true;
          btn.textContent = 'Logging in...';

          try {
            if (window.__ventryAuth && window.__ventryAuth.client) {
              var result = await window.__ventryAuth.client.auth.signInWithPassword({
                email: email,
                password: password,
              });

              if (result.error) {
                errorEl.textContent = result.error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log in';
                return;
              }

              window.location.href = '/dashboard.html';
            } else {
              errorEl.textContent = 'Auth system not configured. Contact support.';
              errorEl.style.display = 'block';
              btn.disabled = false;
              btn.textContent = 'Log in';
            }
          } catch (err) {
            errorEl.textContent = 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Log in';
          }
        });
      }
    })();
  </script>
